    <script>
      (function() {
        // 1. Filter out benign Vite HMR WebSocket console.error logs
        var origConsoleError = console.error;
        console.error = function() {
          var allArgs = Array.prototype.slice.call(arguments).map(function(a) {
            return a instanceof Error ? (a.message + ' ' + (a.stack || '')) : String(a);
          }).join(' ');

          if (
            allArgs.indexOf('WebSocket closed without opened') !== -1 ||
            allArgs.indexOf('failed to connect to websocket') !== -1 ||
            (arguments[0] === '[vite]' && allArgs.indexOf('WebSocket') !== -1)
          ) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        // 2. Suppress unhandled rejections and global errors related to Vite WebSocket
        window.addEventListener('unhandledrejection', function (e) {
          var msg = e && e.reason ? String(e.reason.message || e.reason) : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function (e) {
          var msg = e ? String(e.message || '') : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });

        // 3. Provide harmless mock for Vite HMR socket so @vite/client promise always resolves
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (protocols === 'vite-hmr' || protocols === 'vite-ping') {
              isViteHmr = true;
            } else if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1)) {
              isViteHmr = true;
            }

            if (isViteHmr) {
              var listeners = {};
              var dummy = {
                readyState: 1, // OPEN
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                url: String(url),
                protocol: String(protocols || ''),
                addEventListener: function(event, fn) {
                  listeners[event] = listeners[event] || [];
                  listeners[event].push(fn);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { fn({ type: 'open' }); } catch(err) {}
                    }, 5);
                  }
                },
                removeEventListener: function(event, fn) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(f) { return f !== fn; });
                  }
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {
                  dummy.readyState = 3;
                }
              };
              return dummy;
            }

            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.OPEN = RealWebSocket.OPEN;
          window.WebSocket.CLOSED = RealWebSocket.CLOSED;
          window.WebSocket.CLOSING = RealWebSocket.CLOSING;
          window.WebSocket.CONNECTING = RealWebSocket.CONNECTING;
        }
      })();
    </script>
