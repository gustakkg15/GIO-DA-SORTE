<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="blueRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  
  <!-- Outer glowing blue ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#blueRing)" stroke-width="8" stroke-dasharray="14 10" opacity="0.8"/>
  <circle cx="256" cy="256" r="182" fill="#0f172a" stroke="#1e40af" stroke-width="4"/>

  <!-- Golden Coin -->
  <circle cx="256" cy="256" r="150" fill="url(#goldCoin)"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#fef08a" stroke-width="6" stroke-dasharray="6 6"/>

  <!-- Inner Sparkle Star -->
  <path d="M256 150 L275 225 L350 256 L275 287 L256 362 L237 287 L162 256 L237 225 Z" fill="#ffffff" filter="drop-shadow(0 0 16px #38bdf8)"/>
  
  <!-- Mini sparkles -->
  <polygon points="175,175 183,195 203,203 183,211 175,231 167,211 147,203 167,195" fill="#fef08a"/>
  <polygon points="340,310 346,325 361,331 346,337 340,352 334,337 319,331 334,325" fill="#38bdf8"/>
</svg>
